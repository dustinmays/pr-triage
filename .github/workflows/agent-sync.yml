# Validate-only: fails the PR when generated agent files
# (.claude/agents/*.md, .opencode/agents/*.md) drift from their neutral
# source (agents/*.agent.yaml). Humans run `make agents-sync` to fix drift;
# this workflow never writes anything back.

name: agent-sync

on:
  pull_request:
    branches: [main, 'chunk/**', 'epic/**']

permissions: {}

jobs:
  agents-check:
    name: agents-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
      - run: make agents-check
