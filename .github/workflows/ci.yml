# Layer 1 — mechanical CI. It blocks.
#
# Every job runs a make target from Makefile, never a bare tool command. That
# indirection is the point: tool configurations and flags can be updated in the
# Makefile without altering the workflow definition.
#
# Gating is on the BASE ref:
# - A PR into chunk/** or epic/** gets the cheap fast suite (lint, fmt, vet, test, build).
# - A PR into main gets the full suite including test-race.
# Head branch names stay unconstrained.
#
# Docs-only PRs (every changed file ends in .md) skip the heavy Go/scanner jobs:
# a `changes` job reports code=false and the gated jobs are not run. `lint` is
# deliberately NOT gated — it is a required check, and a skipped required check
# would leave a docs-only PR pending forever; running it on a docs-only change is
# cheap and always green (no Go changed).
#
# The PR pre-scan lives in pr-prescan.yml. That one reports facts and never fails.
# This one is the gate.

name: CI

on:
  pull_request:
    branches: [main, 'chunk/**', 'epic/**']

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        name: any non-markdown files changed?
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Three-dot diff = the PR's own changes since the merge-base.
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "changed files:"
          printf '%s\n' "$changed"
          # The changed files that are NOT markdown. Uses output emptiness, not
          # grep's exit code (BSD `grep -qv` is unreliable), so it behaves the
          # same across GNU/BSD grep.
          non_md="$(printf '%s\n' "$changed" | grep -vE '\.md$' || true)"
          # Skip the heavy suite only when there were changes AND every one was
          # markdown. An empty/unknown diff fails safe by running the full suite.
          if [ -n "$changed" ] && [ -z "$non_md" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3

  fmt-check:
    name: fmt-check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
      - run: make fmt-check

  vet:
    name: vet
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
      - run: make vet

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
      - run: make test

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
      - run: make build

  shellcheck:
    name: shellcheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './scripts'

  test-race:
    name: test:race
    needs: changes
    if: github.base_ref == 'main' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
      - run: make test-race

  prescan-test:
    name: prescan-test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: make prescan-test
