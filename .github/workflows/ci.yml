name: CI

on:
  pull_request:
    branches: [main, epic/pr-triage-poc]
  push:
    branches: [main, epic/pr-triage-poc]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o bin/pr-triage ./cmd/pr-triage

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt check
        run: test -z "$(gofmt -l .)" || (echo "gofmt needed on:"; gofmt -l .; exit 1)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
